name: Release Unity Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          package_version="$(node -p "require('./Packages/com.leesiuuuu.unity-screenshot/package.json').version")"

          release_tag="${GITHUB_REF_NAME}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="v${package_version}"
          fi

          if [[ "v${package_version}" != "${release_tag}" ]]; then
            echo "Tag ${release_tag} does not match package version ${package_version}."
            exit 1
          fi

          echo "PACKAGE_VERSION=${package_version}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "PACKAGE_FILE=Unity-Screenshot-${release_tag}.unitypackage" >> "${GITHUB_ENV}"

      - name: Extract release notes from changelog
        run: >-
          node .github/scripts/extract-release-notes.mjs
          Packages/com.leesiuuuu.unity-screenshot/CHANGELOG.md
          "${PACKAGE_VERSION}"
          release-notes.md

      - name: Prepare Unity project layout
        shell: bash
        run: |
          package_root="Packages/com.leesiuuuu.unity-screenshot"
          asset_root="UnityPackageProject/Assets/UnityScreenshot"

          mkdir -p "${asset_root}" dist
          cp -R "${package_root}/Editor" "${asset_root}/Editor"
          cp "${package_root}/Editor.meta" "${asset_root}/Editor.meta"
          cp LICENSE "${asset_root}/LICENSE.txt"

          cat > "UnityPackageProject/Assets/UnityScreenshot.meta" <<'EOF'
          fileFormatVersion: 2
          guid: bbc167855348465ba88354072da57fb8
          folderAsset: yes
          DefaultImporter:
            externalObjects: {}
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF

          cat > "${asset_root}/LICENSE.txt.meta" <<'EOF'
          fileFormatVersion: 2
          guid: 67937d5e159c4bb7bc8dd8b5849646cc
          TextScriptImporter:
            externalObjects: {}
            userData:
            assetBundleName:
            assetBundleVariant:
          EOF

          (
            cd UnityPackageProject
            {
              echo "Assets/UnityScreenshot.meta"
              find Assets/UnityScreenshot -name '*.meta' -print
            } | sort > ../unitypackage-meta-list.txt
          )

      - name: Create unitypackage
        uses: pCYSl5EDgo/create-unitypackage@b5c57408698b1fab8b3a84d4b67f767b8b7c0be9 # v1.2.3
        with:
          project-folder: UnityPackageProject
          package-path: dist/${{ env.PACKAGE_FILE }}
          include-files: unitypackage-meta-list.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package_path="dist/${PACKAGE_FILE}"

          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
            gh release upload "${RELEASE_TAG}" "${package_path}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${package_path}" \
              --title "${RELEASE_TAG}" \
              --notes-file release-notes.md
          fi
